# The examples must keep working with Kestello's develop branch: every check, and the
# committed Vue builds must match their sources.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1' # weekly, so a change in Kestello that breaks an example shows up

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, sodium, zip, gd, fileinfo, pdo_sqlite
          coverage: none
          tools: none

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Get Kestello, its PHP tools and npm packages
        run: sh tools/setup.sh

      - run: sh tools/check.sh

      - name: The committed builds are current
        if: matrix.php == '8.5'
        run: |
          sh tools/build.sh
          if [ -n "$(git status --porcelain -- plugins themes)" ]; then
            git status --short -- plugins themes
            echo "::error::A committed build is out of date. Run sh tools/build.sh and commit the result."
            exit 1
          fi
